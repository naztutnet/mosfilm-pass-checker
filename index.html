<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Проверка наличия фамилии в заявке на квартальный пропуск на Мосфильм"
    />
    <link
      rel="canonical"
      href="https://naztutnet.github.io/mosfilm-pass-checker/"
    />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Пропуск на Мосфильм" />
    <meta property="og:title" content="Квартальный пропуск на Мосфильм" />
    <meta
      property="og:description"
      content="Проверьте, заказан ли ваш пропуск на IV квартал."
    />
    <meta
      property="og:url"
      content="https://naztutnet.github.io/mosfilm-pass-checker/"
    />
    <meta
      property="og:image"
      content="https://naztutnet.github.io/mosfilm-pass-checker/assets/telegram-preview.png?v=1"
    />
    <meta
      property="og:image:secure_url"
      content="https://naztutnet.github.io/mosfilm-pass-checker/assets/telegram-preview.png?v=1"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Проверка квартального пропуска на Мосфильм"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Квартальный пропуск на Мосфильм" />
    <meta
      name="twitter:description"
      content="Проверьте, заказан ли ваш пропуск на IV квартал."
    />
    <meta
      name="twitter:image"
      content="https://naztutnet.github.io/mosfilm-pass-checker/assets/telegram-preview.png?v=1"
    />
    <title>Квартальный пропуск на Мосфильм</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="checker" aria-labelledby="page-title">
        <header class="checker__header">
          <div class="brandline">
            <div class="brandline__identity">
              <img
                class="mosfilm-logo"
                src="assets/mosfilm-logo.svg"
                alt="Мосфильм"
                width="166"
                height="133"
              />
              <span class="brandline__section">Пропуск</span>
            </div>
            <span class="brandline__quarter">IV квартал</span>
          </div>
          <h1 id="page-title">Квартальный пропуск на Мосфильм</h1>
        </header>

        <form id="pass-form" class="search" novalidate>
          <label class="field" for="surname">
            <span class="field__label">Фамилия</span>
            <input
              id="surname"
              name="surname"
              type="text"
              inputmode="text"
              autocomplete="family-name"
              maxlength="80"
              required
            />
          </label>
          <button id="check-button" type="button">Проверить</button>
          <p id="logging-note" class="logging-note" hidden>
            Фамилия и результат проверки записываются в журнал.
          </p>
        </form>

        <section id="result" class="result" aria-live="polite" hidden>
          <div class="result__mark" aria-hidden="true"></div>
          <div>
            <p id="result-title" class="result__title"></p>
            <p id="result-text" class="result__text"></p>
            <div id="contact-actions" class="contact-actions" hidden>
              <a
                class="contact-actions__telegram"
                href="https://t.me/naz_tut_net"
                target="_blank"
                rel="noopener noreferrer"
              >Telegram: @naz_tut_net</a>
              <a id="phone-link" class="contact-actions__phone" href="#" hidden></a>
            </div>
          </div>
        </section>

      </section>
    </main>

    <script src="assets/pass-hashes.js?v=2"></script>
    <script src="assets/log-config.js?v=1"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
